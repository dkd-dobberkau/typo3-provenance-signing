<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module"/>

<f:section name="Content">
    <f:variable name="ll" value="LLL:EXT:provenance_signing/Resources/Private/Language/locallang_module.xlf:"/>
    <h1><f:translate key="LLL:EXT:provenance_signing/Resources/Private/Language/locallang_mod_revisions.xlf:mlang_labels_tablabel"/></h1>

    <f:if condition="!{pageSelected}">
        <f:then><f:be.infobox state="-1"><f:translate key="{ll}selectPage"/></f:be.infobox></f:then>
        <f:else if="!{mayView}"><f:be.infobox state="2"><f:translate key="{ll}noPageAccess"/></f:be.infobox></f:else>
        <f:else>
            <f:if condition="{inWorkspace}">
                <f:then><f:be.infobox state="1"><f:translate key="{ll}workspaceNotice"/></f:be.infobox></f:then>
                <f:else><p class="text-body-secondary"><f:translate key="{ll}liveNotice"/></p></f:else>
            </f:if>

            <f:if condition="{rows}">
                <f:then>
                    <div class="table-fit">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th><f:translate key="{ll}column.time"/></th>
                                    <th><f:translate key="{ll}column.language"/></th>
                                    <th><f:translate key="{ll}column.hash"/></th>
                                    <th><f:translate key="{ll}column.level"/></th>
                                    <th><f:translate key="{ll}column.request"/></th>
                                    <th><f:translate key="{ll}column.changes"/></th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{rows}" as="row">
                                    <tr>
                                        <td><a href="{row.detailUrl}"><f:format.date format="Y-m-d H:i:s">@{row.revision.signed_at}</f:format.date></a></td>
                                        <td>{row.language}</td>
                                        <td><code>{row.hash}</code></td>
                                        <td><span class="badge badge-success">L{row.revision.cps_conformance}</span></td>
                                        <td><f:translate key="{ll}request.{row.revision.request_kind}"/> <span class="text-body-secondary">{row.revision.request_url}</span></td>
                                        <td>
                                            <f:if condition="{row.first}">
                                                <f:then><f:translate key="{ll}firstRevision"/></f:then>
                                                <f:else>{row.changes}</f:else>
                                            </f:if>
                                        </td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                    </div>
                    <f:if condition="{previousUrl} || {nextUrl}">
                        <nav class="d-flex gap-2">
                            <f:if condition="{previousUrl}"><a class="btn btn-default" href="{previousUrl}"><f:translate key="{ll}previous"/></a></f:if>
                            <f:if condition="{nextUrl}"><a class="btn btn-default" href="{nextUrl}"><f:translate key="{ll}next"/></a></f:if>
                        </nav>
                    </f:if>
                </f:then>
                <f:else>
                    <f:be.infobox state="-1"><f:translate key="{ll}empty"/></f:be.infobox>
                </f:else>
            </f:if>
        </f:else>
    </f:if>
</f:section>

</html>
